<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sobreiro</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

</head>

<body>

    <header class="topo">

        <h1 class="logo">SOBREIRO</h1>

        <div class="icones">
            <i class="fa-regular fa-user"></i>
            <i class="fa-solid fa-bag-shopping"></i>
        </div>

    </header>

    <section class="banner">

        <div class="banner-conteudo">

            <h2>
                presenteie <br>
                com <span>GOSTO</span>
            </h2>

            <p>
                monte sua cesta personalizada conosco!
            </p>

        </div>

    </section>

    <nav class="menu">

        <button data-cat="bebida">BEBIDAS</button>

        <button data-cat="item_comestivel">
            GULOSEIMAS
        </button>

        <button data-cat="decoracao_cesta">
            DECORAÇÕES
        </button>

        <button data-cat="cartao_de_mensagem">
            CARTÕES
        </button>

        <button data-cat="cesta">
            CESTAS
        </button>

    </nav>

    <section class="busca">

        <div class="busca-box">

            <input type="text" placeholder="BEBIDAS" class="pesq">

            <i class="fa-solid fa-magnifying-glass"></i>

        </div>

    </section>

    <section class="areaProdutos"></section>

    <section class="finalizar">

        <button id="btnFinalizar">
            FINALIZAR PEDIDO
        </button>

    </section>
    <footer class="rodape">

        <h2>SOBREIRO</h2>

        <p>2025©</p>

        <div class="redes">

            <i class="fa-brands fa-instagram"></i>

            <i class="fa-brands fa-facebook-f"></i>

        </div>

    </footer>

    <script src="script.js"></script>

</body>

</html>
